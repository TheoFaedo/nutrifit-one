<main class="setup-shell">
  <header class="setup-header"><app-brand /></header>
  <section class="meal-content" aria-labelledby="meal-title">
    <h1 id="meal-title">Food catalogue</h1>
    <p class="muted">
      Find foods and recipes, check their portions and nutrition, or add your own.
    </p>

    <div class="create-tools" role="group" aria-label="Create catalogue items">
      <button class="primary-button" type="button" (click)="newFood()">
        Create food <span aria-hidden="true">＋</span>
      </button>
    </div>
    <div class="catalogue-layout">
    <app-food-catalogue-panel
      class="food-list"
      [query]="query()"
      [sort]="sortOrder()"
      [sortOptions]="sortOptions"
      [foods]="searchResults()"
      [loading]="loading()"
      [error]="error()"
      [offProduct]="offProduct()"
      [selectedId]="selected()?.id ?? null"
      (queryChanged)="queryChanged($event)"
      (sortChanged)="setSortOrder($event)"
      (barcodeDetected)="scannedBarcode($event)"
      (foodSelected)="select($event)"
      (importProduct)="importOff()"
    />

      <app-modal-dialog
        [open]="detailsOpen()"
        [labelledBy]="editing() ? 'food-editor-title' : 'food-title'"
        (closed)="editing() ? closeEditor() : detailsOpen.set(false)"
      >
        @if (detailsOpen()) {
          @if (editing()) {
            <app-food-editor
              [food]="selected()"
              [initialKind]="editorKind()"
              (saved)="editorSaved($event)"
              (dismissed)="closeEditor()"
            />
          } @else if (selected(); as food) {
            <app-food-details
              [food]="food"
              [currentUserId]="currentUserId()"
              (edit)="$event.kind === 'RECIPE' ? editRecipe($event) : edit($event)"
            />
          }
        }
      </app-modal-dialog>
    </div>
  </section>
</main>
<app-bottom-nav active="meal" />
