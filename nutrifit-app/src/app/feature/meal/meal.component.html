<main class="setup-shell">
  <header class="setup-header">
    <app-brand /><app-language-switch (changed)="languageChanged($event)" />
  </header>
  @if (languageError()) {
    <p class="error" role="alert">{{ i18n.t('errors', 'languageSaveFailed') }}</p>
  }
  <section class="meal-content" aria-labelledby="meal-title">
    <h1 id="meal-title">{{ i18n.t('meal', 'title') }}</h1>
    <p class="muted">{{ i18n.t('meal', 'intro') }}</p>

    <div class="create-tools" role="group" [attr.aria-label]="i18n.t('meal', 'createGroup')">
      <button class="primary-button" type="button" (click)="newFood()">
        {{ i18n.t('meal', 'createFood') }} <span aria-hidden="true">＋</span>
      </button>
    </div>
    @if (refreshing()) {
      <p class="muted" role="status">{{ i18n.t('common', 'refreshing') }}</p>
    }
    @if (error()) {
      <button type="button" (click)="load()">{{ i18n.t('common', 'retry') }}</button>
    }
    <div class="catalogue-layout">
      <app-food-catalogue-panel
        class="food-list"
        [query]="query()"
        [sort]="sortOrder()"
        [sortOptions]="sortOptions"
        [foods]="searchResults()"
        [loading]="loading()"
        [error]="error()"
        [offProduct]="offProduct()"
        [selectedId]="selected()?.id ?? null"
        (queryChanged)="queryChanged($event)"
        (sortChanged)="setSortOrder($event)"
        (barcodeDetected)="scannedBarcode($event)"
        (foodSelected)="select($event)"
        (importProduct)="importOff()"
      />

      <app-modal-dialog
        [open]="detailsOpen()"
        [labelledBy]="editing() ? 'food-editor-title' : 'food-title'"
        (closed)="editing() ? closeEditor() : detailsOpen.set(false)"
      >
        @if (detailsOpen()) {
          @if (editing()) {
            <app-food-editor
              [food]="selected()"
              [initialKind]="editorKind()"
              [initialProduct]="offProduct()"
              [initialBarcode]="barcode()"
              (saved)="editorSaved($event)"
              (dismissed)="closeEditor()"
            />
          } @else if (selected(); as food) {
            <app-food-details
              [food]="food"
              [currentUserId]="currentUserId()"
              (edit)="edit($event)"
            />
          }
        }
      </app-modal-dialog>
    </div>
  </section>
</main>
<app-bottom-nav active="meal" />
