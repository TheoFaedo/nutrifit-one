name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: nutrifit-app
        run: bun install --frozen-lockfile

      - name: Build Angular app
        working-directory: nutrifit-app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set the SUPABASE_URL Actions variable and SUPABASE_ANON_KEY Actions secret."
            exit 1
          fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const environment = {
              production: true,
              supabaseUrl: process.env.SUPABASE_URL,
              supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
            };
            writeFileSync(
              "src/environments/environment.production.ts",
              `export const environment = ${JSON.stringify(environment, null, 2)};\n`,
            );
          '
          bun run build --base-href "/${{ github.event.repository.name }}/"
          cp dist/nutrifit-app/browser/index.html dist/nutrifit-app/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nutrifit-app/dist/nutrifit-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
